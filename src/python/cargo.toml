[package]
name = "etym-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the etym Rust library"

[lib]
name = "etym"
crate-type = ["cdylib"]

[dependencies]
# Depend on the local parent crate
etym = { path = "../../" }

# PyO3 dependencies exclusively for the Python wrapper crate
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

[features]
default = []
async = ["dep:pyo3-asyncio", "dep:tokio"]
