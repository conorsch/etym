[build-system]
requires = ["hatchling", "hatch-maturin-build"]
build-backend = "hatchling.build"

[project]
name = "etym-py"
version = "0.1.0"
description = "Python bindings for the etym Rust library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
etym = "etym.__main__:main"
etym-py = "etym.__main__:main"

# Tells Hatchling to use hatch-maturin-build for binary extension targets
[tool.hatch.build.targets.maturin]
manifest-path = "src/python/Cargo.toml"
python-source = "src/python"
module-name = "etym"
features = ["pyo3/extension-module"]
